# ════════════════════════════════════════════════════════════════
# Sveltia CMS configuration for BeanRunner Cafe
#
# Backend: GitHub. Editors sign in with their GitHub account via
# Netlify's OAuth provider (set up once in the Netlify dashboard —
# see README "Content editing (CMS)").
#
# Paths are relative to the REPOSITORY ROOT. The publishable site lives
# in /site, so content files are under "site/content/…".
# ════════════════════════════════════════════════════════════════

backend:
  name: github
  repo: sebastian-carrion/bean-runner-redesign
  branch: main

# Where uploaded images are stored (repo path) and how they're referenced (URL)
media_folder: "site/assets/images/uploads"
public_folder: "/assets/images/uploads"

site_url: https://www.beanrunnercafe.com
display_url: https://www.beanrunnercafe.com
logo_url: https://www.beanrunnercafe.com/assets/images/logo.png

collections:
  # ── EVENTS ───────────────────────────────────────────────────
  - name: events
    label: "Music & Events"
    description: "Upcoming live-music shows that appear on the Events page."
    files:
      - name: events
        label: "Upcoming Shows"
        file: "site/content/events.json"
        fields:
          - name: events
            label: "Shows"
            label_singular: "Show"
            widget: list
            summary: "{{fields.day}} {{fields.month}} — {{fields.name}}"
            fields:
              - { name: day, label: "Day (number)", widget: string, hint: "e.g. 14" }
              - { name: month, label: "Month & year", widget: string, hint: "e.g. June 2026" }
              - { name: type, label: "Genre / type", widget: string, hint: "e.g. Jazz Night" }
              - { name: name, label: "Performer / show name", widget: string }
              - { name: detail, label: "Description", widget: text }
              - { name: time, label: "Day & times", widget: string, hint: "e.g. Sat · Doors 5:30pm · Show 6:00pm" }

  # ── EXHIBITS ─────────────────────────────────────────────────
  - name: exhibits
    label: "Art Gallery"
    description: "Current art exhibits shown on the Gallery page."
    files:
      - name: exhibits
        label: "Exhibits"
        file: "site/content/exhibits.json"
        fields:
          - name: exhibits
            label: "Exhibits"
            label_singular: "Exhibit"
            widget: list
            summary: "{{fields.title}} — {{fields.artist}}"
            fields:
              - { name: title, label: "Exhibit title", widget: string }
              - { name: artist, label: "Artist", widget: string }
              - { name: dates, label: "Dates / medium", widget: string, required: false }
              - { name: status, label: "Status label", widget: string, hint: "e.g. Now Showing", required: false }
              - { name: image, label: "Photo", widget: image, hint: "Square works best." }

  # ── MENU ─────────────────────────────────────────────────────
  - name: menu
    label: "Menu"
    description: "The full food & drink menu, organized by category."
    files:
      - name: menu
        label: "Menu"
        file: "site/content/menu.json"
        fields:
          - { name: note, label: "Footer note", widget: string, required: false }
          - name: categories
            label: "Categories"
            label_singular: "Category"
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: "Tab ID (lowercase, no spaces)", widget: string, hint: "e.g. breakfast" }
              - { name: title, label: "Category title", widget: string }
              - { name: note, label: "Category note", widget: string, required: false }
              - name: items
                label: "Items"
                label_singular: "Item"
                widget: list
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { name: name, label: "Item name", widget: string }
                  - { name: desc, label: "Description", widget: text, required: false }
                  - { name: price, label: "Price", widget: string, hint: "e.g. $9.95 or $5.75 / $6.50 / $7.50" }
                  - name: badge
                    label: "Dietary badge"
                    widget: select
                    required: false
                    options:
                      - { label: "None", value: "" }
                      - { label: "Vegan", value: "vegan" }
                      - { label: "Vegetarian", value: "veg" }
                      - { label: "Gluten-Free", value: "gf" }
                      - { label: "Weekend Special", value: "special" }
                  - { name: image, label: "Photo (optional highlight)", widget: image, required: false }
