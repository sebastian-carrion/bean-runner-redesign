# ════════════════════════════════════════════════════════════════
# Sveltia CMS configuration for BeanRunner Cafe
#
# Backend: GitHub. Editors sign in with their GitHub account via
# Netlify's OAuth provider (set up once in the Netlify dashboard —
# see README "Content editing (CMS)").
#
# Paths are relative to the REPOSITORY ROOT. The publishable site lives
# in /site, so content files are under "site/content/…".
# ════════════════════════════════════════════════════════════════

backend:
  name: github
  repo: sebastian-carrion/bean-runner-redesign
  branch: main

# Only active when the editor is opened on localhost (ignored in production),
# so the CMS can be tested locally against a proxy without GitHub login.
local_backend: true

# Where uploaded images are stored (repo path) and how they're referenced (URL)
media_folder: "site/assets/images/uploads"
public_folder: "/assets/images/uploads"

site_url: https://www.beanrunnercafe.com
display_url: https://www.beanrunnercafe.com

# BeanRunner logo in the editor header
logo:
  src: /assets/images/logo.png
  show_in_header: true

collections:
  # ── EVENTS ───────────────────────────────────────────────────
  - name: events
    label: "Music & Events"
    description: "Upcoming live-music shows that appear on the Events page and homepage."
    files:
      - name: events
        label: "Upcoming Shows"
        file: "site/content/events.json"
        fields:
          - name: events
            label: "Shows"
            label_singular: "Show"
            widget: list
            collapsed: true          # show a tidy summary list, not every field expanded
            summary: "{{fields.date | date('ddd, MMM D')}} — {{fields.name}}"
            fields:
              - { name: type, label: "Genre / type", widget: string, default: "Jazz Night", hint: "e.g. Jazz Night · Salsa · Singer / Songwriter" }
              - { name: name, label: "Performer / show name", widget: string, hint: "The headline act" }
              - { name: detail, label: "Description", widget: text, hint: "One or two sentences" }
              - name: date
                label: "Show date"
                widget: datetime
                format: "YYYY-MM-DD"
                date_format: "ddd, MMM D, YYYY"
                time_format: false       # date only — pick from the calendar
                picker_utc: false
                hint: "Pick from the calendar. The day number, month and weekday are filled in automatically."
              - { name: doors, label: "Doors open", widget: datetime, date_format: false, time_format: "h:mm A", format: "HH:mm", default: "18:30", hint: "Fridays usually 6:30pm, Saturdays 5:30pm" }
              - { name: show, label: "Showtime", widget: datetime, date_format: false, time_format: "h:mm A", format: "HH:mm", default: "19:00", hint: "Fridays usually 7:00pm, Saturdays 6:00pm" }

  # ── EXHIBITS ─────────────────────────────────────────────────
  - name: exhibits
    label: "Art Gallery"
    description: "Current art exhibits shown on the Gallery page."
    files:
      - name: exhibits
        label: "Exhibits"
        file: "site/content/exhibits.json"
        fields:
          - name: exhibits
            label: "Exhibits"
            label_singular: "Exhibit"
            widget: list
            collapsed: true
            summary: "{{fields.title}} — {{fields.artist}}"
            fields:
              - { name: title, label: "Exhibit title", widget: string }
              - { name: artist, label: "Artist", widget: string }
              - { name: dates, label: "Dates / medium", widget: string, required: false, hint: "e.g. June – July 2026, or 'Mixed media'" }
              - { name: status, label: "Status label", widget: string, required: false, default: "Now Showing", hint: "e.g. Now Showing · Featured" }
              - { name: image, label: "Photo", widget: image, hint: "Square works best." }

  # ── MENU ─────────────────────────────────────────────────────
  - name: menu
    label: "Menu"
    description: "The full food & drink menu, organized by category."
    files:
      - name: menu
        label: "Menu"
        file: "site/content/menu.json"
        fields:
          - { name: note, label: "Footer note", widget: string, required: false }
          - name: categories
            label: "Categories"
            label_singular: "Category"
            widget: list
            collapsed: true
            summary: "{{fields.title}}"
            fields:
              - { name: id, label: "Tab ID (lowercase, no spaces)", widget: string, hint: "e.g. breakfast" }
              - { name: title, label: "Category title", widget: string }
              - { name: note, label: "Category note", widget: string, required: false }
              - name: items
                label: "Items"
                label_singular: "Item"
                widget: list
                collapsed: true
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { name: name, label: "Item name", widget: string }
                  - { name: desc, label: "Description", widget: text, required: false }
                  - { name: price, label: "Price", widget: string, hint: "e.g. $9.95 or $5.75 / $6.50 / $7.50" }
                  - name: badge
                    label: "Dietary badge"
                    widget: select
                    required: false
                    default: ""
                    options:
                      - { label: "None", value: "" }
                      - { label: "Vegan", value: "vegan" }
                      - { label: "Vegetarian", value: "veg" }
                      - { label: "Gluten-Free", value: "gf" }
                      - { label: "Weekend Special", value: "special" }
                  - { name: image, label: "Photo (optional highlight)", widget: image, required: false }

# ── DESIGN & BRANDING ────────────────────────────────────────
# A single editable panel for the site's colors & fonts. The site reads
# content/design.json at runtime (js/main.js) and applies these as CSS
# variable overrides — leave the defaults to keep the BeanRunner look.
singletons:
  - name: design
    label: "Design & Branding"
    file: "site/content/design.json"
    icon: palette
    editor:
      preview: false
    summary: "Site colors & fonts"
    fields:
      - { name: accent_color, label: "Accent color — buttons, links, labels", widget: color, default: "#C8963E", allowInput: true }
      - { name: highlight_color, label: "Highlight color — italic accents", widget: color, default: "#E8B860", allowInput: true }
      - { name: page_background, label: "Page background", widget: color, default: "#FAF7F2", allowInput: true }
      - name: heading_font
        label: "Heading font"
        widget: select
        default: "Playfair Display"
        options: ["Playfair Display", "DM Sans", "Georgia"]
      - name: body_font
        label: "Body font"
        widget: select
        default: "DM Sans"
        options: ["DM Sans", "Playfair Display", "Georgia"]
