# Netlify deploy configuration for BeanRunner Cafe
# The publishable static site lives in /site (no build step required).

[build]
  publish = "site"

# Static site — no build command needed.
[build.environment]
  NODE_VERSION = "20"

# Security + caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long-cache static assets (images, css, js are safe to cache hard)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Content JSON should always be fresh so CMS edits show immediately
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
